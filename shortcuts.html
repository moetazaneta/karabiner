<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Karabiner Shortcuts</title>
  <link rel="stylesheet" href="https://vercel.com/geist/vercel-brand.css">
  <style>
    * { box-sizing: border-box; }
    :root { --line: #eaeaea; --line-soft: #f2f2f2; --muted: #666; --hover: #fafafa; }
    body { margin: 0; color: #111; background: #fff; font: 14px Geist, Arial, sans-serif; }
    .app { width: min(1440px, 100%); margin: auto; padding: 0 24px 48px; }
    .toolbar {
      position: sticky; top: 0; z-index: 2;
      display: grid; grid-template-columns: minmax(180px, 280px) minmax(0, 1fr) 54px;
      align-items: center; gap: 12px; min-height: 50px;
      background: color-mix(in srgb, #fff 92%, transparent);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(12px);
    }
    input {
      width: 100%; height: 34px; padding: 0 11px;
      color: inherit; background: #fff; border: 1px solid #ddd; border-radius: 6px;
      font: inherit; outline: none;
    }
    input:hover { border-color: #aaa; }
    input:focus { border-color: #111; box-shadow: 0 0 0 1px #111; }
    .count { color: var(--muted); font: 12px Geist Mono, monospace; text-align: right; }
    #filters { display: flex; justify-content: flex-end; gap: 1px; min-width: 0; }
    button {
      flex: 0 1 auto; padding: 6px 7px; color: var(--muted); background: transparent;
      border: 0; border-radius: 5px; font: 11px Geist, sans-serif; white-space: nowrap; cursor: pointer;
    }
    button:hover { color: #111; background: #f2f2f2; }
    button:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
    button[aria-pressed="true"] { color: #fff; background: #111; }
    #results { columns: 2; column-gap: 24px; padding-top: 16px; }
    section {
      display: inline-block; width: 100%; margin: 0 0 16px;
      overflow: hidden; border: 1px solid var(--line); border-radius: 6px;
      break-inside: avoid;
    }
    h2 {
      display: flex; justify-content: space-between; margin: 0; padding: 8px 10px;
      background: var(--hover); border-bottom: 1px solid var(--line);
      font-size: 11px; font-weight: 600;
    }
    h2 span { color: #999; font-weight: 400; }
    .row {
      display: grid; grid-template-columns: minmax(190px, .9fr) minmax(140px, 1.1fr);
      align-items: center; min-height: 39px; padding: 5px 10px;
      border-bottom: 1px solid var(--line-soft);
    }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--hover); }
    .keys { display: flex; align-items: center; gap: 4px; min-width: 0; }
    kbd {
      padding: 3px 5px; color: inherit; background: #fff;
      border: 1px solid #ddd; border-radius: 4px;
      font: 10px Geist Mono, monospace; white-space: nowrap;
    }
    .join { color: #aaa; font-size: 10px; }
    .action { padding-left: 8px; font-size: 12px; line-height: 1.35; }
    .empty { grid-column: 1 / -1; padding: 60px 0; color: var(--muted); text-align: center; }
    @media (max-width: 1080px) {
      .toolbar { grid-template-columns: minmax(180px, 240px) 1fr 48px; }
      button { padding-inline: 5px; }
    }
    @media (max-width: 820px) {
      .app { padding-inline: 12px; }
      .toolbar { grid-template-columns: minmax(0, 1fr) 48px; }
      #filters { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
      #results { columns: 1; }
    }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; gap: 6px; padding: 8px 0; }
      .row { padding-inline: 9px; }
      .action { padding-left: 0; }
    }
    @media (prefers-color-scheme: dark) {
      :root { --line: #333; --line-soft: #222; --muted: #999; --hover: #161616; }
      body, input, kbd { color: #ededed; background: #000; }
      .toolbar { background: color-mix(in srgb, #000 92%, transparent); }
      input, kbd { border-color: #333; }
      input:hover { border-color: #666; }
      input:focus { border-color: #ededed; box-shadow: 0 0 0 1px #ededed; }
      button:hover { color: #ededed; background: #1a1a1a; }
      button[aria-pressed="true"] { color: #000; background: #ededed; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <input id="search" type="search" placeholder="Search shortcuts…" aria-label="Search shortcuts">
      <nav id="filters" aria-label="Shortcut groups"></nav>
      <span class="count" id="count"></span>
    </header>
    <div id="results"></div>
  </main>
  <script src="shortcuts-data.js"></script>
  <script src="shortcut-renderer.js"></script>
</body>
</html>
